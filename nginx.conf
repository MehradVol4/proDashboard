server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # React Router owns the URLs, so anything that is not a real file has to come
  # back as index.html — otherwise opening /bookings/5 directly is a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed asset filenames change whenever the contents change, so they can be
  # cached hard. index.html must not be, or people keep the old bundle.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
