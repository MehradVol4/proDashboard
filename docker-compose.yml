services:
  api:
    build:
      # Context is the repo root so the image can pick up the sample cabin
      # photos the seed needs.
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/data/dev.db"
      # Change this before putting the app anywhere public.
      JWT_SECRET: "change-me-a-long-random-string"
      JWT_EXPIRES_IN: "7d"
      PORT: "3000"
      CLIENT_ORIGIN: "http://localhost:8080"
      # Written into the URLs of uploaded images, so it has to be the address
      # the browser can reach, not the container name.
      PUBLIC_URL: "http://localhost:3000"
      SEED_ADMIN_EMAIL: "admin@prodashboard.local"
      SEED_ADMIN_PASSWORD: "password1234"
    volumes:
      - api-data:/data
      - api-uploads:/app/uploads
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at build time. Change it and rebuild if the API
        # lives somewhere other than localhost:3000.
        VITE_API_URL: "http://localhost:3000"
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-data:
  api-uploads:
